services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docinsight
      POSTGRES_PASSWORD: docinsight
      POSTGRES_DB: docinsight
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docinsight -d docinsight"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Luôn trỏ vào db local, kể cả khi .env đang chứa URL Neon.
      DATABASE_URL: postgres://docinsight:docinsight@db:5432/docinsight?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
