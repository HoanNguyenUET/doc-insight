services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docinsight
      POSTGRES_PASSWORD: docinsight
      POSTGRES_DB: docinsight
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docinsight -d docinsight"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Luôn trỏ vào db local, kể cả khi .env đang chứa URL Neon.
      DATABASE_URL: postgres://docinsight:docinsight@db:5432/docinsight?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      STORAGE_DIR: /data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ./web
      args:
        # Trình duyệt gọi API qua cổng đã publish ra máy chủ.
        VITE_API_URL: http://localhost:${API_PORT:-8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
  uploads:
